name: Deploy PocketBase

on:
  push:
    branches: [main]
    paths:
      - 'pb/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync pb/ to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > private_key
          chmod 600 private_key
          rsync -avz --delete --exclude='pb_data' --exclude='.env' \
            -e "ssh -i private_key -o StrictHostKeyChecking=no" \
            ./pb/ \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }}:~/vault-pocketbase/
          rm private_key

      - name: Rebuild and restart container
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > private_key
          chmod 600 private_key
          ssh -i private_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_SERVER }} \
            "cd ~/vault-pocketbase && docker compose up -d --build"
          rm private_key
